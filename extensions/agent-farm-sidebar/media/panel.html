<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src __CSP__ 'unsafe-inline'; script-src __CSP__; connect-src http://127.0.0.1:* http://localhost:*;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: var(--vscode-sideBar-background, #1e1e1e);
        --fg: var(--vscode-sideBar-foreground, #ccc);
        --muted: var(--vscode-descriptionForeground, #888);
        --btn: var(--vscode-button-background, #0e639c);
        --btn-fg: var(--vscode-button-foreground, #fff);
        --input-bg: var(--vscode-input-background, #3c3c3c);
        --border: var(--vscode-widget-border, #444);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--vscode-font-family, system-ui, sans-serif);
        font-size: 12px;
        margin: 0;
        padding: 10px;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.4;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .meta {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button {
        background: var(--btn);
        color: var(--btn-fg);
        border: 0;
        padding: 4px 10px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 6px 0 10px;
      }
      .badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        background: var(--input-bg);
      }
      .badge.running {
        color: #86efac;
      }
      .badge.failed,
      .badge.stuck {
        color: #f87171;
      }
      .badge.queued {
        color: #93c5fd;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 12px 0 6px;
      }
      .health-line.health-ok {
        color: #86efac;
      }
      .health-line.health-warn {
        color: #fbbf24;
      }
      .health-line.health-bad {
        color: #f87171;
      }
      .health-line.health-muted {
        color: var(--muted);
      }
      .stuck-none {
        color: #4ade80;
        font-size: 11px;
      }
      .stuck-card {
        border-left: 3px solid #fbbf24;
        padding: 6px 8px;
        margin-bottom: 6px;
        background: var(--input-bg);
        border-radius: 0 4px 4px 0;
        font-size: 11px;
      }
      .stuck-card.high {
        border-left-color: #f87171;
      }
      .stuck-cmd {
        font-family: monospace;
        font-size: 10px;
        color: #60a5fa;
        margin-top: 4px;
        word-break: break-all;
      }
      .stuck-actions {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .stuck-actions button {
        font-size: 10px;
        padding: 2px 8px;
      }
      textarea {
        width: 100%;
        min-height: 56px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--input-bg);
        color: var(--fg);
        resize: vertical;
        font-size: 11px;
      }
      #err {
        color: #f87171;
        font-size: 11px;
        margin: 8px 0;
        white-space: pre-wrap;
        display: none;
      }
      .pipeline {
        max-height: 120px;
        overflow: auto;
        font-size: 10px;
      }
      .pipe-row {
        padding: 3px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .pipe-row span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Agent Farm</h1>
    <p class="meta">
      <span id="ts">—</span>
      <button type="button" id="refresh">刷新</button>
    </p>
    <div id="err"></div>
    <div id="health"></div>
    <div id="summary"></div>
    <div id="badges" class="badges"></div>
    <h2>管线 <span id="pipe-n"></span></h2>
    <div id="pipeline" class="pipeline"></div>
    <h2>Stuck <span id="stuck-n"></span></h2>
    <div id="stuck"></div>
    <h2>派活</h2>
    <textarea id="prompt" placeholder="任务 prompt…"></textarea>
    <p style="margin: 8px 0 0"><button type="button" id="dispatch">入队 execute</button></p>
    <script src="__PANEL_CORE_URI__"></script>
    <script>
      const vscode = acquireVsCodeApi();
      initAgentFarmPanel({
        apiBase: "__API_BASE__",
        theme: "sidebar",
        pollMs: 8000,
        bridge: {
          ensureServer: () => vscode.postMessage({ type: "ensureServer" }),
          onRefresh: () => vscode.postMessage({ type: "refresh" }),
          copyText: (t) => vscode.postMessage({ type: "copyText", text: t }),
          onView: (j) => vscode.postMessage({ type: "view", health: j.health, stuck: j.stuck }),
          onTaskClick: (t) => vscode.postMessage({ type: "taskClick", task_id: t.task_id, prompt: t.prompt }),
        },
      });
    </script>
  </body>
</html>
